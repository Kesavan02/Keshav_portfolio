<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kesavan Portfolio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kesavan Portfolio">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="favicon.png" />
  <link rel="shortcut icon" type="image/jpeg" href="favicon.png" />

  <title>Kesavan | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A0E17;
      /* Portfolio dark background */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 255, 255, 0.1);
      border-top: 4px solid #00FFFF;
      /* Cyan */
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }

    .loader::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 4px solid rgba(138, 43, 226, 0.1);
      border-top: 4px solid #8A2BE2;
      /* Purple */
      border-radius: 50%;
      animation: spin 2s linear infinite reverse;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #00FFFF;
      font-family: 'Inter', Arial, sans-serif;
      margin-top: 30px;
      letter-spacing: 4px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
        text-shadow: none;
      }

      100% {
        opacity: 1;
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">Initializing Engine...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
